[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "periodica-app"
version = "2.3.0"
description = "KivyMD desktop GUI for the periodica scientific computation library: interactive, data-driven views of the periodica registry (Windows, macOS, Linux)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Andrew Watts"}]
keywords = [
    "chemistry", "physics", "periodic-table", "visualization",
    "materials-science", "protein-folding", "microstructure",
    "kivy", "kivymd", "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "periodica>=2.0.37",
    "kivy>=2.3.0",
    "kivymd>=1.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/periodica-app"
Repository = "https://github.com/andrewkwatts-maker/periodica-app"

[project.scripts]
periodica-app = "periodica_app.app:main"

# Windowless launcher.  Deliberately not named "periodica": the library
# installs a "periodica" CLI and this entry point used to overwrite it.
[project.gui-scripts]
periodica-app-gui = "periodica_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
periodica_app = ["config/*.json", "kv/*.kv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tier B - needs a real GL context (hidden Kivy window); opt-in, run with -m gpu",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
